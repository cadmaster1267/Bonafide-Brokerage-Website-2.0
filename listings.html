<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonafide Listings</title>
    <link rel="icon" type="png" href="logos/Bonafide Logo Short White.png"> 
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/listings.css">

</head>
<body>
       
    
    <header>
        <div>
            <a href="index.html"><img src="logos/Bonafide Brokerage Logo Black.png" alt="Bonafide Brokerage" class="header-logo"></a>
        </div>
    </header>

    <div>
        <div class="page-header-listings">
            <div class="listings-title">
                Listings
            </div>
        </div>

        <div style="display: flex; justify-content: center; align-items: start;">
            <div class="ls-main">


                <button data-open-modal="modal01" class="ls-bio">
                    <div class="listing-card">
                        <div class="listing-card-header">
                            $525,000
                        </div>
                    </div>
                </button>

               <dialog data-modal="modal01" class="listing-pop-up">
                    <div>
                        Listings Coming Soon!
                    </div>
                </dialog>
                
                <button data-open-modal="modal02" class="ls-bio">
                    <div class="listing-card">
                        <div class="listing-card-header">
                            $457,000
                        </div>
                    </div>
                </button>

               <dialog data-modal="modal02" class="listing-pop-up">
                    <div>
                        Listings Coming Soon!
                    </div>
                </dialog>
                
            </div>
        </div>
    </div>


    <div>
        <footer style="font-size: 2rem;">
            Joan Gill - Brokers License # B.1003347
        </footer>
    </div>

    <script>
        const openButtons = document.querySelectorAll("[data-open-modal]");
        const closeButtons = document.querySelectorAll("[data-close-modal]");

        openButtons.forEach(button => {
            button.addEventListener("click", () => {
                const modalID = button.dataset.openModal;
                const modal = document.querySelector(
                    `[data-modal="${modalID}"]`
                );

                modal.showModal();
            });
        })

        closeButtons.forEach(button => {
            button.addEventListener("click", () => {
                button.closest("dialog").close();
            });
        });

        document.querySelectorAll("dialog").forEach(modal => {
            modal.addEventListener("click", (event) => {
                if (event.target === modal) {
                    modal.close();
                }
            });
        });
    </script>
</body>
</html>
